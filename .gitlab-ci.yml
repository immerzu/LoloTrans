image: ghcr.io/cirruslabs/android-sdk:35

stages:
  - build
  - lint

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  DEBIAN_FRONTEND: "noninteractive"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - chmod +x ./gradlew
  - ./gradlew --version

build_debug:
  stage: build
  script:
    - ./gradlew assembleFullDebug assembleFdroidDebug --stacktrace
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - app/build/outputs/apk/full/debug/
      - app/build/outputs/apk/fdroid/debug/

lint_debug:
  stage: lint
  script:
    - ./gradlew lintFullDebug lintFdroidDebug --stacktrace
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - app/build/reports/
