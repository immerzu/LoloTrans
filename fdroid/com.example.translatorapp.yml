Name: LoloTrans
Summary: Floating-Bubble-Übersetzer für Android
Description: |-
  LoloTrans ist ein Android-Übersetzer mit einer frei verschiebbaren
  Floating-Bubble. Nach aktivem Antippen der Bubble liest die App den
  kopierten Text aus der Zwischenablage, erkennt optional automatisch
  die Quellsprache und zeigt die Übersetzung in einem verschiebbaren
  Overlay an.

  Die App überwacht die Zwischenablage nicht dauerhaft. Der
  Clipboard-Zugriff erfolgt nur nach aktivem Nutzer-Tap auf die Bubble.
  Die Übersetzung läuft komplett auf dem Gerät (kein externer Server).

  Internet-Zugriff wird nur für den initialen Download der
  ML-Kit-Sprachmodelle benötigt. Nach dem Download sind alle
  Übersetzungen offline und lokal.

  Achtung: Die App verwendet Google ML Kit (proprietäres SDK). Dies
  kann die Aufnahme in das offizielle F-Droid-Repository ausschließen.

RepoType: git
Repo: https://github.com/immerzu/LoloTrans.git

Builds:
  - versionName: '1.7'
    versionCode: 8
    commit: v1.7
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
