# F-Droid Metadata Proposal für LoloTrans
#
# Der F-Droid-Build nutzt den Flavor "fdroid", der KEIN Google ML Kit
# und KEINE Google Play Services enthält. Übersetzung erfolgt über
# einen LibreTranslate-kompatiblen Server.
#
# Nutzer müssen eine Server-URL in den Einstellungen konfigurieren.
# Es werden keine API-Keys hartcodiert.

Categories:
  - Writing
  - Utilities
License: Apache-2.0
AuthorName: immerzu
AuthorEmail: immerzu46@gmail.com
SourceCode: https://github.com/immerzu/LoloTrans
IssueTracker: https://github.com/immerzu/LoloTrans/issues
Changelog: https://github.com/immerzu/LoloTrans/releases

Name: LoloTrans
Summary: Floating-Bubble-Übersetzer für Android
Description: |-
  LoloTrans ist ein Android-Übersetzer mit einer frei verschiebbaren
  Floating-Bubble. Nach aktivem Antippen der Bubble liest die App den
  kopierten Text aus der Zwischenablage, erkennt optional automatisch
  die Quellsprache und zeigt die Übersetzung in einem verschiebbaren
  Overlay an.

  Diese F-Droid-Variante enthält kein Google ML Kit. Die Übersetzung
  erfolgt über einen LibreTranslate-kompatiblen Server. Die Server-URL
  kann in den Einstellungen frei konfiguriert werden. Es werden keine
  API-Keys vorausgesetzt oder hartcodiert.

  Die App überwacht die Zwischenablage nicht dauerhaft. Der
  Clipboard-Zugriff erfolgt nur nach aktivem Nutzer-Tap auf die Bubble.

RepoType: git
Repo: https://github.com/immerzu/LoloTrans.git

Builds:
