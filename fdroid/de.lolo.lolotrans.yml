Name: LoloTrans
AutoName: LoloTrans
Summary: Floating-bubble translator with user-configurable backend
Description: |-
  LoloTrans is an Android translator with a freely movable
  floating bubble. After actively tapping the bubble, the app reads
  copied text from the clipboard, auto-detects the source language
  and shows the translation in a movable overlay.

  This F-Droid variant uses a LibreTranslate-compatible provider.
  No Google ML Kit, no Google Play Services, no Firebase. The
  LibreTranslate server URL is user-configurable. No API keys are
  hardcoded or required.

  The app does not monitor the clipboard continuously. Clipboard
  text is read only after an explicit user tap on the bubble.

